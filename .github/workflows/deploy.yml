name: Déploiement LWS

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # permet aussi de lancer à la main depuis GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'     # même version que sur LWS

      - name: Dépendances PHP
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # Décommentez si vous utilisez Vite / des assets front
      # - uses: actions/setup-node@v4
      #   with: { node-version: '20' }
      # - run: npm ci && npm run build

      - name: Envoi FTP (fichiers modifiés uniquement)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps            # mettez ftp si ftps est refusé
          server-dir: /public_html/temoignage.as-krea.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.*
            storage/**
            bootstrap/cache/*.php
            tests/**
            public/storage

      - name: Tâches après déploiement (migrations, caches)
        run: |
          curl -fsS -X POST "${{ secrets.DEPLOY_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Accept: application/json"